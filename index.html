<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GS Tools Admin</title>
<style>
:root{--bg:#f7f7f8;--card:#fff;--ink:#171717;--muted:#777;--line:#e6e6e9;--accent:#5e6ad2;--bad:#c62828;--ok:#15803d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.01em}button,input,select,textarea{font:inherit}.hidden{display:none!important}.muted{color:var(--muted);font-size:13px;line-height:1.6}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#8a8a94;font-weight:700}.logo{width:42px;height:42px;background:#171717;color:white;border-radius:12px;display:grid;place-items:center;font-weight:800}.logo.small{width:31px;height:31px;border-radius:9px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:650;cursor:pointer}.primary{background:#171717;color:#fff}.accent{background:var(--accent);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.danger{color:var(--bad)}.full{width:100%}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.auth-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:0 16px 60px rgba(0,0,0,.06)}.auth-card h1{font-size:30px;margin:16px 0 6px;letter-spacing:-.045em}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1f1f3;border-radius:10px;padding:3px;margin:22px 0 4px}.tab{border:0;background:transparent;border-radius:8px;padding:9px;font-weight:650;color:#777;cursor:pointer}.tab.active{background:#fff;color:#171717;box-shadow:0 1px 3px rgba(0,0,0,.08)}label{display:block;font-size:13px;font-weight:650;margin-top:16px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#fff;outline:0}input,select{height:42px;padding:0 12px;margin-top:7px}textarea{min-height:110px;padding:12px;margin-top:7px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#adb4ee;box-shadow:0 0 0 3px rgba(94,106,210,.12)}.auth-card .btn{margin-top:20px}.msg{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}.error{color:var(--bad)}.success{color:var(--ok)}
.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{height:100vh;position:sticky;top:0;background:#fbfbfc;border-right:1px solid var(--line);padding:15px}.brand{display:flex;align-items:center;gap:10px;padding:7px 6px 20px}.brand b,.brand span{display:block}.brand b{font-size:14px}.brand span{font-size:11px;color:var(--muted)}nav button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:10px;border-radius:8px;color:#555;cursor:pointer;margin:1px 0}nav button:hover,nav button.active{background:#efeff2;color:#171717}.account{position:absolute;left:14px;right:14px;bottom:16px;border-top:1px solid var(--line);padding-top:13px}.account span,.account b{display:block;overflow:hidden;text-overflow:ellipsis}.account span{font-size:10px;color:var(--muted)}.account b{font-size:12px;margin:4px 0 10px}
main{padding:34px 38px 60px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:25px}.top h1{font-size:30px;margin:5px 0;letter-spacing:-.045em}.actions,.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px}.stat{padding:18px}.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:30px;margin-top:12px}.panel{margin-top:18px;overflow:hidden}.panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-head h2{font-size:17px;margin:0}.table{width:100%;border-collapse:collapse}.table th{font-size:11px;color:#92929b;font-weight:500;text-align:left;padding:11px 15px;border-bottom:1px solid var(--line)}.table td{font-size:13px;padding:14px 15px;border-bottom:1px solid #f0f0f2}.table tr.click{cursor:pointer}.table tr.click:hover{background:#fafafa}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:650}.new,.rejected,.suspended{background:#fff1f2;color:#be123c}.checking,.pending{background:#fff7ed;color:#9a3412}.developing,.editor{background:#eef2ff;color:#4338ca}.resolved,.approved{background:#ecfdf3;color:#15803d}.closed,.viewer{background:#f3f4f6;color:#52525b}.master{background:#171717;color:#fff}
.inbox-grid{display:grid;grid-template-columns:minmax(360px,1fr) minmax(430px,1fr);min-height:620px}.issue-list{border-right:1px solid var(--line)}.issue{padding:15px 18px;border-bottom:1px solid #efeff2;cursor:pointer}.issue:hover,.issue.active{background:#f8f8fa}.issue b{font-size:14px}.meta{font-size:12px;color:var(--muted);margin-top:7px;display:flex;gap:8px;flex-wrap:wrap}.detail{padding:24px}.detail h3{font-size:22px;margin:6px 0}.kv{display:grid;grid-template-columns:110px 1fr;gap:10px 13px;font-size:13px;margin:20px 0}.kv .k{color:var(--muted)}.box{background:#fafafa;border:1px solid var(--line);border-radius:11px;padding:15px;white-space:pre-wrap;line-height:1.65;font-size:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.program-card{padding:18px;display:flex;justify-content:space-between;gap:16px;align-items:center}.release-row{display:grid;grid-template-columns:120px 1fr 150px 220px;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid #efeff2}.member-row{display:grid;grid-template-columns:1.2fr .8fr 1.2fr auto;gap:14px;align-items:center;padding:15px 18px;border-bottom:1px solid #efeff2}.empty{padding:50px 20px;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;right:24px;bottom:24px;background:#171717;color:#fff;padding:11px 14px;border-radius:9px;font-size:13px}
@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{display:none}main{padding:22px 16px}.stats{grid-template-columns:1fr 1fr}.inbox-grid,.two{grid-template-columns:1fr}.issue-list{border-right:0}.detail{border-top:1px solid var(--line)}.release-row,.member-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="auth" class="auth-wrap">
  <div class="auth-card">
    <div class="logo">G</div>
    <div class="eyebrow">GS TOOLS ADMIN</div>
    <h1 id="authTitle">로그인</h1>
    <p class="muted">접수사항, 공지, 프로그램 버전과 설치파일을 함께 관리합니다.</p>
    <div class="tabs"><button id="loginTab" class="tab active">로그인</button><button id="signupTab" class="tab">회원가입</button></div>
    <div id="loginForm">
      <label>이메일<input id="loginEmail" type="email" placeholder="name@example.com"></label>
      <label>비밀번호<input id="loginPassword" type="password" placeholder="비밀번호"></label>
      <button id="loginBtn" class="btn primary full">로그인</button>
      <div id="loginMsg" class="msg">승인된 회원만 관리자 화면을 이용할 수 있습니다.</div>
    </div>
    <div id="signupForm" class="hidden">
      <label>이름<input id="signupName" placeholder="이름"></label>
      <label>전화번호<input id="signupPhone" placeholder="010-0000-0000"></label>
      <label>부서<input id="signupDept" placeholder="예: 안전보건팀"></label>
      <label>이메일<input id="signupEmail" type="email" placeholder="name@example.com"></label>
      <label>비밀번호<input id="signupPassword" type="password" placeholder="비밀번호"></label>
      <label>비밀번호 확인<input id="signupPassword2" type="password" placeholder="비밀번호 확인"></label>
      <button id="signupBtn" class="btn primary full">가입 신청</button>
      <div id="signupMsg" class="msg">가입 후 Master 승인 후 이용할 수 있습니다.</div>
    </div>
  </div>
</section>
<section id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><div class="logo small">G</div><div><b>GS Tools</b><span>Admin</span></div></div>
    <nav>
      <button data-page="dashboard" class="active">⌂ 대시보드</button>
      <button data-page="inbox">▣ 접수함 <span id="openCount"></span></button>
      <button data-page="notices">◉ 공지사항</button>
      <button data-page="programs">⌘ 프로그램</button>
      <button data-page="releases">↑ 버전관리</button>
      <button data-page="members" id="membersNav" class="hidden">◎ 회원관리</button>
    </nav>
    <div class="account">
      <span id="profileRole">USER</span>
      <b id="profileEmail"></b>
      <button id="logoutBtn" class="btn ghost full">로그아웃</button>
    </div>
  </aside>
  <main>
    <section id="dashboard" class="page"></section>
    <section id="inbox" class="page hidden"></section>
    <section id="notices" class="page hidden"></section>
    <section id="programs" class="page hidden"></section>
    <section id="releases" class="page hidden"></section>
    <section id="members" class="page hidden"></section>
  </main>
</section>
<div id="toast" class="toast hidden"></div>
<script>
window.addEventListener('error',function(e){
  var el=document.getElementById('loginMsg');
  if(el) el.innerHTML='<span class="error">화면 초기화 오류: '+String(e.message||'unknown error')+'</span>';
});
window.addEventListener('unhandledrejection',function(e){
  var el=document.getElementById('loginMsg');
  if(el) el.innerHTML='<span class="error">연결 오류: '+String((e.reason&&e.reason.message)||e.reason||'unknown error')+'</span>';
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sbClient=window.supabase.createClient('https://vzfujgzhxtrtqrzqwtsq.supabase.co','sb_publishable_nVx9IH3WMgukXfhu7Im1Bg_hoz8JmCa',{auth:{persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const state={profile:null,feedback:[],programs:[],notices:[],releases:[],members:[],selected:null,programFilter:'',statusFilter:'',releaseProgram:''};
const statusKo={new:'미처리',checking:'처리중',developing:'개발중',resolved:'해결완료',closed:'종료'},catKo={error:'오류',suggestion:'건의',question:'문의'};
const fmt=d=>d?new Date(d).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-',pname=c=>state.programs.find(p=>p.code===c)?.name||c||'-',canEdit=()=>['master','editor'].includes(state.profile?.role),isMaster=()=>state.profile?.role==='master';
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2200)}
function setAuthMode(m){const l=m==='login';$('#loginForm').classList.toggle('hidden',!l);$('#signupForm').classList.toggle('hidden',l);$('#loginTab').classList.toggle('active',l);$('#signupTab').classList.toggle('active',!l);$('#authTitle').textContent=l?'로그인':'회원가입'}
async function login(){const email=$('#loginEmail').value.trim().toLowerCase(),password=$('#loginPassword').value;if(!email||!password){$('#loginMsg').innerHTML='<span class="error">이메일과 비밀번호를 입력해주세요.</span>';return}$('#loginMsg').textContent='로그인 중...';const {error}=await sbClient.auth.signInWithPassword({email,password});if(error){$('#loginMsg').innerHTML='<span class="error">'+esc(error.message)+'</span>';return}await enter()}
async function signup(){const name=$('#signupName').value.trim(),phone=$('#signupPhone').value.trim(),department=$('#signupDept').value.trim(),email=$('#signupEmail').value.trim().toLowerCase(),password=$('#signupPassword').value,p2=$('#signupPassword2').value;if(!name||!phone||!department||!email||!password){$('#signupMsg').innerHTML='<span class="error">모든 항목을 입력해주세요.</span>';return}if(email==='daheekoo@gsenc.com'){$('#signupMsg').innerHTML='<span class="error">Master 계정은 Supabase에서 직접 생성해주세요.</span>';return}if(password!==p2){$('#signupMsg').innerHTML='<span class="error">비밀번호가 일치하지 않습니다.</span>';return}$('#signupMsg').textContent='가입 신청 중...';const {data,error}=await sbClient.auth.signUp({email,password,options:{data:{name,phone,department}}});if(error){$('#signupMsg').innerHTML='<span class="error">'+esc(error.message)+'</span>';return}if(data.session)await sbClient.auth.signOut();$('#signupMsg').innerHTML='<span class="success">가입 신청 완료. Master 승인 후 로그인할 수 있습니다.</span>'}
async function enter(){const {data:{user}}=await sbClient.auth.getUser();if(!user)return;const {data:profile,error}=await sbClient.from('profiles').select('*').eq('user_id',user.id).maybeSingle();if(error||!profile){await sbClient.auth.signOut();$('#loginMsg').innerHTML='<span class="error">회원 정보를 불러오지 못했습니다.</span>';return}if(profile.status!=='approved'){await sbClient.auth.signOut();const msg=profile.status==='pending'?'가입 승인을 기다리는 중입니다.':profile.status==='suspended'?'사용이 중지된 계정입니다.':'가입 신청이 승인되지 않았습니다.';$('#loginMsg').innerHTML='<span class="error">'+msg+'</span>';return}state.profile=profile;$('#profileRole').textContent=profile.role.toUpperCase();$('#profileEmail').textContent=profile.email;$('#membersNav').classList.toggle('hidden',!isMaster());$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');await refresh();go('dashboard')}
async function refresh(){const [f,p,n,r]=await Promise.all([sbClient.from('feedback').select('*').order('created_at',{ascending:false}),sbClient.from('programs').select('*').eq('is_active',true).order('created_at'),sbClient.from('notices').select('*').order('published_at',{ascending:false}),sbClient.from('releases').select('*').order('created_at',{ascending:false})]);if(f.error){toast('접수함 불러오기 실패: '+f.error.message);return}state.feedback=f.data||[];state.programs=p.data||[];state.notices=n.data||[];state.releases=r.data||[];$('#openCount').textContent=state.feedback.filter(x=>!['resolved','closed'].includes(x.status)).length||''}
function go(page,id=null){$$('.page').forEach(x=>x.classList.add('hidden'));$('#'+page).classList.remove('hidden');$$('nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(id)state.selected=id;({dashboard:renderDashboard,inbox:renderInbox,notices:renderNotices,programs:renderPrograms,releases:renderReleases,members:renderMembers}[page])()}
const top=(k,t,s,e='')=>'<div class="top"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><div class="muted">'+s+'</div></div>'+e+'</div>';
function renderDashboard(){const a=state.feedback.filter(x=>x.status==='new').length,b=state.feedback.filter(x=>['checking','developing'].includes(x.status)).length,d=state.feedback.filter(x=>x.status==='resolved').length;$('#dashboard').innerHTML=top('Overview','좋은 아침이에요.','오늘 처리할 항목을 한눈에 확인하세요.','<button id="openInbox" class="btn primary">접수함 열기 →</button>')+'<div class="stats"><div class="card stat"><span>미처리</span><b>'+a+'</b></div><div class="card stat"><span>처리중</span><b>'+b+'</b></div><div class="card stat"><span>해결완료</span><b>'+d+'</b></div><div class="card stat"><span>등록 프로그램</span><b>'+state.programs.length+'</b></div></div><div class="panel"><div class="panel-head"><h2>최근 접수</h2></div>'+(state.feedback.length?'<table class="table"><thead><tr><th>상태</th><th>프로그램</th><th>내용</th><th>유형</th><th>접수</th></tr></thead><tbody>'+state.feedback.slice(0,6).map(x=>'<tr class="click recent" data-id="'+x.id+'"><td><span class="badge '+x.status+'">'+(statusKo[x.status]||x.status)+'</span></td><td>'+esc(pname(x.program_code))+'</td><td>'+esc(x.title||x.body||'')+'</td><td>'+esc(catKo[x.category]||x.category)+'</td><td>'+fmt(x.created_at)+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">접수 내용이 없습니다.</div>')+'</div>';$('#openInbox').onclick=()=>go('inbox');$$('.recent').forEach(r=>r.onclick=()=>go('inbox',r.dataset.id))}
const filtered=()=>state.feedback.filter(x=>(!state.programFilter||x.program_code===state.programFilter)&&(!state.statusFilter||x.status===state.statusFilter));
function renderInbox(){const list=filtered();if(!state.selected||!list.some(x=>x.id===state.selected))state.selected=list[0]?.id||null;const sel=list.find(x=>x.id===state.selected),pf='<select id="programFilter"><option value="">전체 프로그램</option>'+state.programs.map(p=>'<option value="'+p.code+'" '+(state.programFilter===p.code?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>',sf='<select id="statusFilter"><option value="">전체 상태</option>'+Object.entries(statusKo).map(([k,v])=>'<option value="'+k+'" '+(state.statusFilter===k?'selected':'')+'>'+v+'</option>').join('')+'</select>';$('#inbox').innerHTML=top('Inbox','접수함','오류와 건의사항을 프로그램별로 관리합니다.','<div class="filters">'+pf+sf+'</div>')+'<div class="panel inbox-grid"><div class="issue-list">'+(list.length?list.map(x=>'<div class="issue '+(x.id===state.selected?'active':'')+'" data-id="'+x.id+'"><b>'+esc(x.title||x.body||'(제목 없음)')+'</b><div class="meta"><span>'+esc(pname(x.program_code))+'</span><span>·</span><span>'+esc(catKo[x.category]||x.category)+'</span><span>·</span><span>'+fmt(x.created_at)+'</span><span class="badge '+x.status+'">'+(statusKo[x.status]||x.status)+'</span></div></div>').join(''):'<div class="empty">조건에 맞는 접수 없음</div>')+'</div><div class="detail">'+detailHtml(sel)+'</div></div>';$('#programFilter').onchange=e=>{state.programFilter=e.target.value;renderInbox()};$('#statusFilter').onchange=e=>{state.statusFilter=e.target.value;renderInbox()};$$('.issue').forEach(i=>i.onclick=()=>{state.selected=i.dataset.id;renderInbox()});bindDetail(sel)}
function detailHtml(x){if(!x)return '<div class="empty">접수 항목을 선택해주세요.</div>';let a=canEdit()?'<button id="saveNote" class="btn ghost">저장</button><button id="resolve" class="btn accent">해결완료</button>':'';if(x.reporter_email)a+='<button id="mail" class="btn ghost">이메일 작성</button>';return '<div class="eyebrow">'+esc(pname(x.program_code))+'</div><h3>'+esc(x.title||'접수 상세')+'</h3><div class="kv"><div class="k">상태</div><div><select id="detailStatus" '+(!canEdit()?'disabled':'')+'>'+Object.entries(statusKo).map(([k,v])=>'<option value="'+k+'" '+(x.status===k?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div class="k">버전</div><div>'+esc(x.program_version||'-')+'</div><div class="k">접수자</div><div>'+esc(x.reporter_name||'-')+'</div><div class="k">이메일</div><div>'+esc(x.reporter_email||'-')+'</div><div class="k">접수일</div><div>'+fmt(x.created_at)+'</div></div><div class="box">'+esc(x.body||'')+'</div><label>관리자 답변 / 처리 메모<textarea id="adminNote" '+(!canEdit()?'disabled':'')+'>'+esc(x.admin_note||'')+'</textarea></label><div class="actions">'+a+'</div>'}
function bindDetail(x){if(!x)return;if($('#detailStatus')&&canEdit())$('#detailStatus').onchange=e=>saveFeedback(x.id,{status:e.target.value,resolved_at:e.target.value==='resolved'?new Date().toISOString():null});if($('#saveNote'))$('#saveNote').onclick=()=>saveFeedback(x.id,{admin_note:$('#adminNote').value});if($('#resolve'))$('#resolve').onclick=()=>saveFeedback(x.id,{status:'resolved',admin_note:$('#adminNote').value,resolved_at:new Date().toISOString()});if($('#mail'))$('#mail').onclick=()=>{const s=encodeURIComponent('[GS Tools] 요청하신 접수사항이 처리되었습니다'),b=encodeURIComponent('안녕하세요.\\n\\n프로그램: '+pname(x.program_code)+'\\n요청: '+(x.title||x.body||'')+'\\n처리내용: '+($('#adminNote').value||'처리가 완료되었습니다.'));location.href='mailto:'+x.reporter_email+'?subject='+s+'&body='+b}}
async function saveFeedback(id,patch){if(!canEdit())return;const {error}=await sbClient.from('feedback').update({...patch,updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast('저장 실패: '+error.message);await refresh();state.selected=id;renderInbox();toast('저장했습니다.')}
function renderNotices(){const form=canEdit()?'<div class="panel"><div class="panel-head"><h2>새 공지 등록</h2></div><div style="padding:18px"><label>대상 프로그램<select id="noticeProgram"><option value="">전체 프로그램</option>'+state.programs.map(p=>'<option value="'+p.code+'">'+esc(p.name)+'</option>').join('')+'</select></label><label>제목<input id="noticeTitle"></label><label>내용<textarea id="noticeBody"></textarea></label><label class="muted"><input id="noticePinned" type="checkbox" style="width:auto;height:auto"> 중요 공지로 고정</label><button id="noticeSave" class="btn primary">공지 게시</button></div></div>':'',list='<div class="panel"><div class="panel-head"><h2>게시된 공지</h2></div>'+(state.notices.length?state.notices.map(n=>'<div style="padding:16px 18px;border-bottom:1px solid #efeff2"><div class="eyebrow">'+(n.is_pinned?'PINNED · ':'')+esc(n.program_code?pname(n.program_code):'전체')+'</div><b>'+esc(n.title)+'</b><div class="muted">'+esc(n.body)+'</div></div>').join(''):'<div class="empty">공지 없음</div>')+'</div>';$('#notices').innerHTML=top('Announcements','공지사항','프로그램에서 표시할 공지를 관리합니다.')+'<div class="two">'+form+list+'</div>';if($('#noticeSave'))$('#noticeSave').onclick=saveNotice}
async function saveNotice(){const payload={program_code:$('#noticeProgram').value||null,title:$('#noticeTitle').value.trim(),body:$('#noticeBody').value.trim(),is_pinned:$('#noticePinned').checked};if(!payload.title||!payload.body)return toast('제목과 내용을 입력해주세요.');const {error}=await sbClient.from('notices').insert(payload);if(error)return toast('등록 실패: '+error.message);await refresh();renderNotices();toast('공지를 게시했습니다.')}
function renderPrograms(){$('#programs').innerHTML=top('Programs','프로그램','등록된 프로그램과 최신 버전을 확인합니다.')+'<div class="two">'+state.programs.map(p=>'<div class="card program-card"><div><div class="eyebrow">'+esc(p.code)+'</div><h3>'+esc(p.name)+'</h3><div class="muted">최신 버전 '+esc(p.latest_version||'-')+'</div></div><button class="btn primary manage" data-code="'+p.code+'">버전관리</button></div>').join('')+'</div>';$$('.manage').forEach(b=>b.onclick=()=>{state.releaseProgram=b.dataset.code;go('releases')})}
const approvalBadge=s=>'<span class="badge '+(s==='approved'?'approved':s==='rejected'?'rejected':'pending')+'">'+({pending:'승인 대기',approved:'승인됨',rejected:'반려'}[s]||s)+'</span>';
function renderReleases(){const code=state.releaseProgram||state.programs[0]?.code||'';state.releaseProgram=code;const list=state.releases.filter(r=>r.program_code===code),extra='<select id="releaseProgram">'+state.programs.map(p=>'<option value="'+p.code+'" '+(p.code===code?'selected':'')+'>'+esc(p.name)+'</option>').join('')+'</select>',form=canEdit()?'<div class="panel"><div class="panel-head"><h2>새 버전 등록</h2></div><div style="padding:18px"><label>버전<input id="rv" placeholder="예: 1.6.2"></label><label>업데이트 제목<input id="rt"></label><label>설치파일<input id="rf" type="file"></label><label>변경사항<textarea id="rc" placeholder="한 줄에 하나"></textarea></label><button id="releaseSave" class="btn primary">Master 검토 요청</button></div></div>':'';$('#releases').innerHTML=top('Releases','버전관리','Editor 등록 → Master 승인 → 최신 버전 반영',extra)+(canEdit()?'<div class="two">'+form+'<div class="panel"><div class="panel-head"><h2>배포 흐름</h2></div><div style="padding:18px"><div class="box">버전 등록 → 승인 대기 → Master 검토 → 승인 → 최신 버전 지정 → 최신/직전 2개 파일만 유지</div></div></div></div>':'')+'<div class="panel"><div class="panel-head"><h2>'+esc(pname(code))+' 배포 기록</h2></div>'+(list.length?list.map(r=>'<div class="release-row"><div><b>v'+esc(r.version)+'</b><div>'+approvalBadge(r.approval_status||'pending')+'</div></div><div><b>'+esc(r.title)+'</b><div class="muted">'+(Array.isArray(r.changes)?r.changes.map(esc).join(' · '):'')+'</div></div><div class="muted">'+(r.approved_at?'승인 '+fmt(r.approved_at):'등록 '+fmt(r.created_at))+'</div><div class="actions">'+(r.file_path?'<button class="btn ghost dl" data-path="'+esc(r.file_path)+'">다운로드</button>':'')+(isMaster()&&r.approval_status==='pending'?'<button class="btn accent approve-release" data-id="'+r.id+'">승인</button><button class="btn ghost reject-release" data-id="'+r.id+'">반려</button>':'')+'</div></div>').join(''):'<div class="empty">배포 기록 없음</div>')+'</div>';$('#releaseProgram').onchange=e=>{state.releaseProgram=e.target.value;renderReleases()};if($('#releaseSave'))$('#releaseSave').onclick=uploadRelease;$$('.dl').forEach(b=>b.onclick=()=>downloadRelease(b.dataset.path));$$('.approve-release').forEach(b=>b.onclick=()=>approveRelease(b.dataset.id));$$('.reject-release').forEach(b=>b.onclick=()=>rejectRelease(b.dataset.id))}
async function uploadRelease(){const code=state.releaseProgram,version=$('#rv').value.trim(),title=$('#rt').value.trim(),file=$('#rf').files[0],changes=$('#rc').value.split('\\n').map(x=>x.trim()).filter(Boolean);if(!version||!title||!file)return toast('버전, 제목, 설치파일을 입력해주세요.');const path=code+'/'+Date.now()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),up=await sbClient.storage.from('release-files').upload(path,file);if(up.error)return toast('업로드 실패: '+up.error.message);const ins=await sbClient.from('releases').insert({program_code:code,version,title,changes,file_path:path,file_name:file.name,file_size:file.size,approval_status:'pending'});if(ins.error)return toast('등록 실패: '+ins.error.message);await refresh();renderReleases();toast('Master 검토 요청으로 등록했습니다.')}
async function approveRelease(id){if(!isMaster())return;const r=state.releases.find(x=>x.id===id);if(!r)return;const {data:{user}}=await sbClient.auth.getUser(),now=new Date().toISOString();let q=await sbClient.from('releases').update({approval_status:'approved',approved_by:user.id,approved_at:now,rejection_reason:null,published_at:now}).eq('id',id);if(q.error)return toast('승인 실패: '+q.error.message);q=await sbClient.from('programs').update({latest_version:r.version,current_version:r.version,updated_at:now}).eq('code',r.program_code);if(q.error)return toast('최신 버전 반영 실패: '+q.error.message);await cleanupApproved(r.program_code);await refresh();renderReleases();toast('배포 승인 완료')}
async function rejectRelease(id){if(!isMaster())return;const reason=prompt('반려 사유를 입력해주세요.')||'Master 반려',{error}=await sbClient.from('releases').update({approval_status:'rejected',rejection_reason:reason,approved_by:null,approved_at:null}).eq('id',id);if(error)return toast('반려 실패: '+error.message);await refresh();renderReleases()}
async function cleanupApproved(code){const {data}=await sbClient.from('releases').select('*').eq('program_code',code).eq('approval_status','approved').order('approved_at',{ascending:false});for(const r of (data||[]).slice(2).filter(x=>x.file_path)){const d=await sbClient.storage.from('release-files').remove([r.file_path]);if(!d.error)await sbClient.from('releases').update({file_path:null,file_size:null}).eq('id',r.id)}}
async function downloadRelease(path){const {data,error}=await sbClient.storage.from('release-files').download(path);if(error)return toast('다운로드 실패: '+error.message);const u=window.URL.createObjectURL(data),a=document.createElement('a');a.href=u;a.download=path.split('/').pop();a.click();window.URL.revokeObjectURL(u)}
async function renderMembers(){if(!isMaster()){go('dashboard');return}const {data,error}=await sbClient.from('profiles').select('*').order('created_at',{ascending:false});if(error)return toast('회원 목록 오류: '+error.message);state.members=data||[];const pending=state.members.filter(x=>x.status==='pending').length;$('#members').innerHTML=top('Members','회원관리','가입 승인, 권한, 상태, Master 전용 메모를 관리합니다.','<span class="badge pending">승인 대기 '+pending+'</span>')+'<div class="panel">'+state.members.map(m=>'<div class="member-row"><div><b>'+esc(m.name||'(이름 없음)')+'</b><div class="muted">'+esc(m.email)+'</div><div class="muted">'+esc(m.department||'-')+' · '+esc(m.phone||'-')+'</div></div><div><span class="badge '+m.role+'">'+m.role.toUpperCase()+'</span> <span class="badge '+m.status+'">'+m.status+'</span></div><div><input class="member-memo" data-id="'+m.user_id+'" value="'+esc(m.admin_memo||'')+'" placeholder="Master 메모"></div><div class="actions">'+(m.role==='master'?'<span class="muted">Master</span>':'<select class="member-role" data-id="'+m.user_id+'"><option value="viewer" '+(m.role==='viewer'?'selected':'')+'>Viewer</option><option value="editor" '+(m.role==='editor'?'selected':'')+'>Editor</option></select>'+(m.status==='pending'?'<button class="btn accent approve-member" data-id="'+m.user_id+'">승인</button><button class="btn ghost reject-member" data-id="'+m.user_id+'">거절</button>':'<button class="btn ghost save-member" data-id="'+m.user_id+'">저장</button><button class="btn ghost suspend-member" data-id="'+m.user_id+'">'+(m.status==='suspended'?'복구':'중지')+'</button>'))+'</div></div>').join('')+'</div>';$$('.approve-member').forEach(b=>b.onclick=()=>approveMember(b.dataset.id));$$('.reject-member').forEach(b=>b.onclick=()=>rejectMember(b.dataset.id));$$('.save-member').forEach(b=>b.onclick=()=>saveMember(b.dataset.id));$$('.suspend-member').forEach(b=>b.onclick=()=>toggleMember(b.dataset.id))}
const memberFields=id=>({role:document.querySelector('.member-role[data-id="'+id+'"]')?.value||'viewer',admin_memo:document.querySelector('.member-memo[data-id="'+id+'"]')?.value||''});
async function approveMember(id){const {data:{user}}=await sbClient.auth.getUser(),f=memberFields(id),{error}=await sbClient.from('profiles').update({...f,status:'approved',approved_by:user.id,approved_at:new Date().toISOString(),updated_at:new Date().toISOString()}).eq('user_id',id);if(error)return toast('승인 실패: '+error.message);toast('회원 승인 완료');renderMembers()}
async function rejectMember(id){const f=memberFields(id),{error}=await sbClient.from('profiles').update({...f,status:'rejected',updated_at:new Date().toISOString()}).eq('user_id',id);if(error)return toast('거절 실패: '+error.message);renderMembers()}
async function saveMember(id){const f=memberFields(id),{error}=await sbClient.from('profiles').update({...f,updated_at:new Date().toISOString()}).eq('user_id',id);if(error)return toast('저장 실패: '+error.message);toast('저장했습니다.');renderMembers()}
async function toggleMember(id){const m=state.members.find(x=>x.user_id===id);if(!m)return;const {error}=await sbClient.from('profiles').update({status:m.status==='suspended'?'approved':'suspended',updated_at:new Date().toISOString()}).eq('user_id',id);if(error)return toast('상태 변경 실패: '+error.message);renderMembers()}
$$('nav button[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));$('#loginTab').onclick=()=>setAuthMode('login');$('#signupTab').onclick=()=>setAuthMode('signup');$('#loginBtn').onclick=login;$('#signupBtn').onclick=signup;$('#logoutBtn').onclick=async()=>{await sbClient.auth.signOut();location.reload()};$('#loginPassword').onkeydown=e=>{if(e.key==='Enter')login()};(async()=>{const {data:{session}}=await sbClient.auth.getSession();if(session)await enter();})().catch(e=>{const el=document.getElementById('loginMsg');if(el)el.innerHTML='<span class="error">초기화 오류: '+esc(e?.message||e)+'</span>';});
</script>
