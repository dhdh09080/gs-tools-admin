<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GS Tools Admin</title>
<link rel="stylesheet" href="./styles.css?v=build-20261010-3">
</head>
<body>
<section id="auth" class="auth-wrap">
  <div class="auth-card">
    <div class="logo">G</div>
    <div class="eyebrow">GS TOOLS ADMIN</div>
    <h1 id="authTitle">로그인</h1>
    <p class="muted">접수사항, 공지, 프로그램 버전과 설치파일을 함께 관리합니다.</p>
    <div class="tabs"><button id="loginTab" class="tab active">로그인</button><button id="signupTab" class="tab">회원가입</button></div>
    <div id="loginForm">
      <label>이메일<input id="loginEmail" type="email" placeholder="name@example.com"></label>
      <label>비밀번호<input id="loginPassword" type="password" placeholder="비밀번호"></label>
      <button id="loginBtn" class="btn primary full">로그인</button>
      <div id="loginMsg" class="msg">승인된 회원만 관리자 화면을 이용할 수 있습니다.</div><div class="msg" style="opacity:.45;margin-top:6px">build 2026.10.10-3</div>
    </div>
    <div id="signupForm" class="hidden">
      <label>이름<input id="signupName" placeholder="이름"></label>
      <label>전화번호<input id="signupPhone" placeholder="010-0000-0000"></label>
      <label>부서<input id="signupDept" placeholder="예: 안전보건팀"></label>
      <label>이메일<input id="signupEmail" type="email" placeholder="name@example.com"></label>
      <label>비밀번호<input id="signupPassword" type="password" placeholder="비밀번호"></label>
      <label>비밀번호 확인<input id="signupPassword2" type="password" placeholder="비밀번호 확인"></label>
      <button id="signupBtn" class="btn primary full">가입 신청</button>
      <div id="signupMsg" class="msg">가입 후 Master 승인 후 이용할 수 있습니다.</div>
    </div>
  </div>
</section>
<section id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><div class="logo small">G</div><div><b>GS Tools</b><span>Admin</span></div></div>
    <nav>
      <button data-page="dashboard" class="active">⌂ 대시보드</button>
      <button data-page="inbox">▣ 접수함 <span id="openCount"></span></button>
      <button data-page="notices">◉ 공지사항</button>
      <button data-page="programs">⌘ 프로그램</button>
      <button data-page="releases">↑ 버전관리</button>
      <button data-page="members" id="membersNav" class="hidden">◎ 회원관리</button>
    </nav>
    <div class="account">
      <span id="profileRole">USER</span>
      <b id="profileEmail"></b>
      <button id="logoutBtn" class="btn ghost full">로그아웃</button>
    </div>
  </aside>
  <main>
    <section id="dashboard" class="page"></section>
    <section id="inbox" class="page hidden"></section>
    <section id="notices" class="page hidden"></section>
    <section id="programs" class="page hidden"></section>
    <section id="releases" class="page hidden"></section>
    <section id="members" class="page hidden"></section>
  </main>
</section>
<div id="toast" class="toast hidden"></div>
<script>
window.addEventListener('error', function(e){
  var el=document.getElementById('loginMsg');
  if(el) el.innerHTML='<span class="error">화면 초기화 오류: '+String(e.message||'unknown error')+'</span>';
});
window.addEventListener('unhandledrejection', function(e){
  var el=document.getElementById('loginMsg');
  if(el) el.innerHTML='<span class="error">연결 오류: '+String((e.reason&&e.reason.message)||e.reason||'unknown error')+'</span>';
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./app.js?v=build-20261010-3"></script>
</body>
</html>
